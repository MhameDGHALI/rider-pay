name: rider_pay
version: "1.0.0"
config-version: 2
profile: rider_pay

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  start_date: "2026-01-01"
  end_date: "2026-02-28"
  congestion_zone_threshold: 0.95
  congestion_zone_min_trips: 100

models:
  rider_pay:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  rider_pay:
    taxi_zone_lookup:
      +column_types:
        LocationID: int64
        Borough: string
        Zone: string
        service_zone: string
    operators:
      +column_types:
        license_num: string
        operator_name: string