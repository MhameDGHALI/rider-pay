name: rider_pay
version: "1.0.0"
config-version: 2
profile: rider_pay

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  rider_pay:
    staging:
      +materialized: view
      +schema: staging

seeds:
  rider_pay:
    taxi_zone_lookup:
      +column_types:
        LocationID: int64
        Borough: string
        Zone: string
        service_zone: string