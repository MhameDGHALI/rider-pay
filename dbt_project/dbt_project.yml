name: rider_pay
version: "1.0.0"
config-version: 2
profile: rider_pay

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  start_date: "2026-01-01"
  end_date: "2026-02-28"
  congestion_zone_threshold: 0.95
  congestion_zone_min_trips: 100
  exp_seed: "switchback_v1"

models:
  rider_pay:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    simulation:
      +materialized: table
      +schema: simulation
    experiments:
      +materialized: table
      +schema: experiments

seeds:
  rider_pay:
    taxi_zone_lookup:
      +column_types:
        LocationID: int64
        Borough: string
        Zone: string
        service_zone: string
    operators:
      +column_types:
        license_num: string
        operator_name: string
    sim_scenarios:
      +column_types:
        scenario_id: string
        scenario_label: string
        is_baseline: int64
    sim_rules:
      +column_types:
        rule_id: string
        rule_label: string
        snow_condition: string
        day_type: string
        hour_from: int64
        hour_to: int64
        zone_condition: string
        airport_condition: string
        operator: string
        bonus_type: string
        bonus_value: float64
    sim_scenario_rules:
      +column_types:
        scenario_id: string
        rule_id: string
    exp_excluded_dates:
      +column_types:
        excluded_date: date
        reason: string