version: 2

models:
  - name: int_trip_economics
    description: >
      Une ligne par course. Ajoute à stg_hvfhv_trips des variables de calendrier, des mesures
      économiques (marge plateforme, rémunération par heure et par mile de course), des durées
      d'attente et des indicateurs d'anomalies. Aucune ligne n'est supprimée.
    columns:
      - name: trip_id
        description: "Identifiant de la course, clé de la table."
        data_tests:
          - unique
          - not_null
      - name: pickup_hour_start_at
        description: "Heure de prise en charge arrondie à l'heure pleine (DATETIME). Sert à joindre la météo horaire."
        data_tests:
          - not_null
      - name: pickup_day_of_week
        description: "Jour de la semaine de la prise en charge : 1 = dimanche, 7 = samedi (convention BigQuery)."
      - name: is_weekend
        description: "Vrai si la prise en charge a lieu un samedi ou un dimanche."
      - name: platform_margin_usd
        description: "Tarif de base moins rémunération du chauffeur. Marge brute APPROXIMATIVE : le tarif de base exclut taxes, péages et frais, et la définition exacte de driver_pay est à confirmer dans le dictionnaire TLC."
      - name: platform_margin_rate
        description: "Marge divisée par le tarif de base. Vide si le tarif de base est nul ou négatif."
      - name: driver_pay_per_trip_hour_usd
        description: "Rémunération divisée par la durée de la course, ramenée à l'heure. Ce n'est PAS un salaire horaire : le temps d'attente entre deux courses n'est pas compté."
      - name: driver_pay_per_mile_usd
        description: "Rémunération divisée par la distance en miles. Vide si la distance est nulle."
      - name: driver_earnings_with_tips_usd
        description: "driver_pay + pourboire. À confirmer : cela suppose que driver_pay n'inclut pas le pourboire (voir le dictionnaire TLC)."
      - name: seconds_request_to_on_scene
        description: "Secondes entre la demande et on_scene_at. À utiliser uniquement si has_timeline_anomaly est faux, et en médiane : valeurs extrêmes observées de -17 h à +27 h. Le dictionnaire TLC réserve on_scene_datetime aux véhicules accessibles, mais la donnée est remplie pour toutes les courses."
      - name: seconds_on_scene_to_pickup
        description: "Secondes entre l'arrivée du chauffeur et la prise en charge du client."
      - name: seconds_request_to_pickup
        description: "Secondes entre la demande du client et sa prise en charge. Pour 1,34 % des courses, request_at est postérieur à pickup_at (valeur négative) : filtrer sur has_timeline_anomaly = faux et utiliser la médiane."
      - name: has_negative_driver_pay
        description: "Rémunération négative."
      - name: has_zero_driver_pay
        description: "Rémunération nulle."
      - name: has_nonpositive_fare
        description: "Tarif de base nul ou négatif."
      - name: has_nonpositive_distance
        description: "Distance nulle ou négative."
      - name: has_nonpositive_duration
        description: "Durée nulle ou négative."
      - name: has_inconsistent_duration
        description: "trip_seconds diffère de plus d'une seconde de l'écart entre prise en charge et dépose."
      - name: has_timeline_anomaly
        description: "Chronologie incohérente : demande après on_scene_at, ou on_scene_at après la prise en charge. Environ 1,8 % des courses, presque toujours à cause de request_at (demande après la prise en charge pour 1,34 % des courses). Exclu de is_clean_trip : il faut le filtrer séparément dans les analyses d'attente."
      - name: is_clean_trip
        description: "Vrai si aucun des six premiers indicateurs d'anomalie (montants, distance, durée) n'est levé. Ne couvre PAS la chronologie : pour une analyse d'attente, filtrer aussi has_timeline_anomaly = faux."
        data_tests:
          - not_null